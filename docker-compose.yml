services:
  atera-exporter:
    image: ghcr.io/guyvolvo/atera-exporter:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atera-exporter
    restart: unless-stopped

    env_file: .env
    environment:
      POLL_INTERVAL_AGENTS: 5m
      POLL_INTERVAL_ALERTS: 1m
      POLL_INTERVAL_TICKETS: 2m
      ATERA_RPS: "3"

    ports:
      - "127.0.0.1:9199:9199"

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    healthcheck:
      test: ["CMD", "/atera-exporter", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
