# Two ways to run this, same file:
#   docker compose up -d           pulls the published image
#   docker compose up -d --build   builds from this checkout instead
#
# No bundled Prometheus or Grafana — point your existing stack at :9199.
services:
  atera-exporter:
    image: ghcr.io/guyvolvo/atera-exporter:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atera-exporter
    restart: unless-stopped

    # The key lives in .env (chmod 600), never in this file and never in the image.
    env_file: .env
    environment:
      POLL_INTERVAL_AGENTS: 5m
      POLL_INTERVAL_ALERTS: 1m
      POLL_INTERVAL_TICKETS: 2m
      # Conservative against Atera's rate limit. Raise only after confirming
      # atera_api_requests_total{code="429"} stays at zero.
      ATERA_RPS: "3"

    # Loopback only. Prometheus scrapes from this same host, so /metrics — which
    # exposes the whole device inventory — never reaches the LAN and needs no auth.
    ports:
      - "127.0.0.1:9199:9199"

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    healthcheck:
      # No shell or curl in the distroless image, so it probes itself.
      test: ["CMD", "/atera-exporter", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
